<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instruction | Burgener Art | Wdd131</title>
    <meta name="description" content="This page provides a form to request instruction of creating art">
    <meta name="author" content="Brady Burgener">
    <link rel="stylesheet" href="./styles/common.css">
    <link rel="stylesheet" href="./styles/common-large.css">
    <link rel="stylesheet" href="./styles/instruction.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Yarndings+20&display=swap" rel="stylesheet">
    
    <script src="./scripts/common.js" defer></script>
    <script src="./scripts/instruction.js" defer></script>
</head>
<body>
    <header>
        <span class="header">Burgener Art</span>
        <button id="menu" title="hamburger menu"></button>
        <nav>
            <a href="../index.html" id="home">Home</a>
            <a href="./index.html" id="art">Burgener Art Home</a>
            <a href="./instruction.html" id="instruction">Art Instruction</a>
            <a href="./about.html" id="about">About</a>
        </nav>
    </header>
    <main>
        <h1>Burgener Art - Instruction</h1>
        <form method="get" action="thankyou.html">
            <div class="section">
                <label for="training" class="section">Product Name<span class="required">*</span> <select name="training" id="training" required>
                    <option value="" disabled selected>Select a Training ...</option>
                </select></label>
            </div>
            
            <div class="section">
                <label for="date" class="section">Desired Date of Training Range (+/- 10 days from this date)<span class="required">*</span> <input type="date" name="date" id="date" required></label>
            </div>

            <div class="sectino">
                <label for="email">Your email address<span class="required">*</span>: </address><input type="email" name="email" id="email" required></label>
            </div>
            
            
            <div class="section">Which feature do you find useful in Trainings? <br>(Check all that apply)
                <label for="oil"><input type="checkbox" name="oil" id="oil" value="oil">Oil Painting</label>
                <label for="acrylic"><input type="checkbox" name="acrylic" id="acrylic" value="acrylic">Acrylic Painting</label>
                <label for="water"><input type="checkbox" name="water" id="water" value="water">Watercolor Painting</label>
                <label for="beginning"><input type="checkbox" name="beginning" id="beginning" value="beginning">For Beginners</label>
                <label for="advance"><input type="checkbox" name="advance" id="advance" value="advance">For Advance Learning</label>
            </div>

            <div class="section">
                <label for="review" class="section">Specifics of the training you would like to have (Optional)<textarea name="review" id="review"></textarea></label>
            </div>

            <div class="section">
                <label for="name" class="section">Your Name (Optional)<input type="text" name="name" id="name"></label>
            </div>

            <input type="submit" value="Request Training" class="submit">
        </form>
    </main>
    <footer>
        <p>&copy;<span id="currentyear"></span> <span class="yarndings">a</span> Brady Burgener <span class="yarndings">a</span> Idaho, USA</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
